<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>PROJECT HUB</title>
<meta name="description" content="개인과 팀의 프로젝트를 카드로 소개하는 인터랙티브 허브 — PROJECT HUB" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet" />

<style>
  :root {
    --bg: #0D0B1A;
    --bg-soft: #14112a;
    --primary: #C13FE0;
    --primary-soft: rgba(193, 63, 224, 0.35);
    --cyan: #3fd7f5;
    --text-dim: #B9B4CC;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%;
    height: 100%;
    background: var(--bg);
    overflow: hidden;
    font-family: 'Rajdhani', sans-serif;
    color: #fff;
    -webkit-font-smoothing: antialiased;
  }

  #intro {
    position: fixed;
    inset: 0;
    z-index: 1;
    width: 100%;
    height: 100%;
  }

  #bg-canvas {
    position: fixed;
    inset: 0;
    display: block;
    width: 100vw;
    height: 100vh;
    outline: none;
  }

  /* soft vignette to focus the eye toward center + hide grid hard edges */
  .vignette {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    background:
      radial-gradient(ellipse 70% 60% at 50% 42%, transparent 40%, rgba(13,11,26,0.55) 78%, rgba(13,11,26,0.92) 100%);
  }

  /* faint scanline texture for a digital/CRT undertone, very subtle */
  .scanlines {
    position: fixed;
    inset: 0;
    z-index: 2;
    pointer-events: none;
    opacity: 0.06;
    background: repeating-linear-gradient(
      to bottom,
      #fff 0px,
      #fff 1px,
      transparent 1px,
      transparent 3px
    );
    mix-blend-mode: overlay;
  }

  .overlay {
    position: fixed;
    inset: 0;
    z-index: 3;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 0 24px;
    pointer-events: none;
  }

  .eyebrow {
    font-family: 'Press Start 2P', cursive;
    font-size: clamp(9px, 1.3vw, 11px);
    letter-spacing: 4px;
    color: var(--primary);
    opacity: 0;
    text-shadow: 0 0 12px var(--primary-soft);
    transform: translateY(16px);
    animation: fadeUp 0.8s ease forwards 0.1s;
  }

  .title {
    font-family: 'Press Start 2P', cursive;
    font-size: clamp(30px, 7vw, 68px);
    line-height: 1.35;
    letter-spacing: 6px;
    margin-top: 22px;
    color: #fff;
    text-shadow:
      0 0 8px rgba(255,255,255,0.5),
      0 0 26px var(--primary-soft),
      0 0 60px rgba(193, 63, 224, 0.25);
    opacity: 0;
    transform: translateY(24px);
    animation: fadeUp 0.9s ease forwards 0.32s;
  }

  .title span {
    color: var(--primary);
  }

  .tagline {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 500;
    font-size: clamp(14px, 1.7vw, 19px);
    letter-spacing: 1.5px;
    color: var(--text-dim);
    margin-top: 22px;
    max-width: 560px;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 0.9s ease forwards 0.58s;
  }

  .enter-btn {
    pointer-events: auto;
    margin-top: 52px;
    font-family: 'Press Start 2P', cursive;
    font-size: 13px;
    letter-spacing: 4px;
    color: #fff;
    background: rgba(193, 63, 224, 0.05);
    border: 1px solid var(--primary);
    padding: 17px 44px;
    border-radius: 6px;
    cursor: pointer;
    position: relative;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 0.9s ease forwards 0.85s;
    transition: box-shadow 0.35s ease, background 0.35s ease, color 0.2s ease, transform 0.15s ease;
  }

  .enter-btn:hover {
    background: rgba(193, 63, 224, 0.12);
    box-shadow:
      0 0 14px rgba(193, 63, 224, 0.7),
      0 0 44px rgba(193, 63, 224, 0.35);
  }

  .enter-btn:active {
    transform: translateY(20px) scale(0.97);
  }

  .enter-btn.glitching {
    animation: glitch 0.42s linear;
  }

  .hint {
    position: fixed;
    left: 50%;
    bottom: 34px;
    transform: translateX(-50%);
    z-index: 3;
    font-family: 'Rajdhani', sans-serif;
    font-size: 12px;
    letter-spacing: 3px;
    color: rgba(185, 180, 204, 0.5);
    opacity: 0;
    animation: fadeUp 0.9s ease forwards 1.1s;
    pointer-events: none;
  }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes glitch {
    0%   { transform: translate(0, 0); }
    18%  { transform: translate(-3px, 2px);  text-shadow: 2px 0 #3fd7f5, -2px 0 #ff2fd0; }
    36%  { transform: translate(3px, -1px);  text-shadow: -2px 0 #3fd7f5, 2px 0 #ff2fd0; }
    54%  { transform: translate(-2px, 1px);  text-shadow: 1px 0 #3fd7f5, -1px 0 #ff2fd0; }
    72%  { transform: translate(2px, -2px);  text-shadow: none; }
    100% { transform: translate(0, 0); text-shadow: none; }
  }

  @media (max-width: 640px) {
    .title { letter-spacing: 3px; }
    .tagline { letter-spacing: 0.8px; }
    .hint { display: none; }
  }

  /* ---------------- gallery section (revealed via GSAP after ENTER) ---------------- */
  #gallery {
    position: fixed;
    inset: 0;
    z-index: 5;
    height: 100vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    background: var(--bg);
    opacity: 0;
    pointer-events: none;
    /* initial yPercent is set via gsap.set() in JS so GSAP owns the transform
       from the start — mixing a CSS-authored transform with a later GSAP
       tween on the same property causes the two to stack instead of replace */
  }

  .gallery-backdrop {
    position: absolute;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 60% 45% at 50% 0%, rgba(193,63,224,0.14), transparent 65%),
      repeating-linear-gradient(0deg, rgba(193,63,224,0.05) 0px, rgba(193,63,224,0.05) 1px, transparent 1px, transparent 48px),
      repeating-linear-gradient(90deg, rgba(193,63,224,0.05) 0px, rgba(193,63,224,0.05) 1px, transparent 1px, transparent 48px);
  }

  .gallery-page {
    position: relative;
    z-index: 1;
    min-height: 100%;
  }

  .gallery-page header {
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding: 64px 24px 40px;
  }

  .brand {
    font-family: 'Press Start 2P', cursive;
    font-size: clamp(18px, 3vw, 26px);
    letter-spacing: 4px;
    text-shadow: 0 0 8px rgba(255,255,255,0.4), 0 0 26px var(--primary-soft);
  }

  .brand span { color: var(--primary); }

  .gallery-page header p {
    margin-top: 16px;
    font-size: clamp(13px, 1.4vw, 16px);
    letter-spacing: 1.5px;
    color: var(--text-dim);
  }

  .gallery-page main {
    max-width: 1240px;
    margin: 0 auto;
    padding: 0 24px 100px;
  }

  @media (max-width: 560px) {
    .gallery-page header { padding: 48px 20px 32px; }
  }

  /* ---------------- draggable coverflow gallery ---------------- */
  .gallery {
    --card-w: clamp(160px, 19vw, 230px);
    --card-h: calc(var(--card-w) * 1.42);
    position: relative;
    padding: 10px 0 40px;
  }

  .cards {
    position: relative;
    list-style: none;
    height: var(--card-h);
    perspective: 1400px;
    -webkit-user-select: none;
    user-select: none;
    touch-action: pan-y;
  }

  .cards li {
    position: absolute;
    top: 0;
    left: 50%;
    width: var(--card-w);
    height: var(--card-h);
    margin-left: calc(var(--card-w) / -2);
    border-radius: 14px;
    overflow: hidden;
    background: var(--thumb-bg);
    border: 1px solid var(--border-dim, rgba(193,63,224,0.22));
    cursor: none;
    transform-style: preserve-3d;
    will-change: transform, opacity;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
  }

  .cards li.selected {
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(193, 63, 224, 0.85), 0 0 26px rgba(193, 63, 224, 0.55);
  }

  .card-face {
    position: absolute;
    inset: 0;
  }

  .card-face::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 14px);
  }

  .card-face::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to top, rgba(9,7,18,0.94) 0%, rgba(9,7,18,0.4) 42%, transparent 68%);
  }

  .card-glyph {
    position: absolute;
    top: 40%;
    left: 50%;
    width: 38px;
    height: 38px;
    margin: -19px 0 0 -19px;
    border: 1.5px solid rgba(255,255,255,0.3);
    border-radius: 4px;
    transform: rotate(45deg);
  }

  .card-glyph::after {
    content: '';
    position: absolute;
    inset: 8px;
    border: 1.5px solid rgba(255,255,255,0.3);
  }

  .card-number {
    position: absolute;
    top: 14px;
    left: 16px;
    z-index: 1;
    font-family: 'Press Start 2P', cursive;
    font-size: 11px;
    color: #fff;
    text-shadow: 0 0 10px rgba(0,0,0,0.6);
    letter-spacing: 1px;
  }

  .card-info {
    position: absolute;
    left: 16px;
    right: 16px;
    bottom: 16px;
    z-index: 1;
  }

  .card-title {
    font-family: 'Press Start 2P', cursive;
    font-size: 11px;
    letter-spacing: 1.2px;
    line-height: 1.6;
  }

  .card-summary {
    margin-top: 8px;
    font-size: 13px;
    letter-spacing: 0.5px;
    color: var(--text-dim);
  }

  .actions {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin-top: 30px;
  }

  .actions button {
    pointer-events: auto;
    font-family: 'Press Start 2P', cursive;
    font-size: 10px;
    letter-spacing: 2px;
    color: #fff;
    background: rgba(193, 63, 224, 0.05);
    border: 1px solid var(--border-dim, rgba(193,63,224,0.22));
    padding: 12px 22px;
    border-radius: 6px;
    cursor: pointer;
    transition: border-color 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
  }

  .actions button:hover {
    border-color: var(--primary);
    background: rgba(193, 63, 224, 0.12);
    box-shadow: 0 0 12px rgba(193, 63, 224, 0.5), 0 0 32px rgba(193, 63, 224, 0.25);
  }

  .drag-proxy {
    position: fixed;
    top: 0;
    left: 0;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 14px;
    padding: 5px 10px;
    border: 1px solid var(--primary-soft);
    border-radius: 999px;
    font-family: 'Press Start 2P', cursive;
    font-size: 8px;
    letter-spacing: 1px;
    color: var(--primary);
    white-space: nowrap;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .badge-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--primary);
    box-shadow: 0 0 8px var(--primary);
    animation: pulse 1.8s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 1; }
  }

  /* ---------------- modal ---------------- */
  .modal-overlay {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: rgba(13, 11, 26, 0.82);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: auto;
  }

  .modal {
    width: 100%;
    max-width: 560px;
    background: linear-gradient(160deg, var(--bg-soft), #0c0a18);
    border: 1px solid var(--primary);
    border-radius: 16px;
    padding: 40px;
    position: relative;
    box-shadow: 0 0 30px rgba(193, 63, 224, 0.35), 0 0 90px rgba(193, 63, 224, 0.18);
    transform: scale(0.94) translateY(8px);
    transition: transform 0.32s cubic-bezier(0.2, 0.8, 0.2, 1);
  }

  .modal-overlay.open .modal {
    transform: scale(1) translateY(0);
  }

  .modal-close {
    position: absolute;
    top: 18px;
    right: 18px;
    width: 34px;
    height: 34px;
    border-radius: 8px;
    border: 1px solid var(--border-dim, rgba(193,63,224,0.22));
    background: transparent;
    color: #fff;
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    transition: border-color 0.25s ease, box-shadow 0.25s ease;
  }

  .modal-close:hover {
    border-color: var(--primary);
    box-shadow: 0 0 12px rgba(193, 63, 224, 0.5);
  }

  .modal-thumb {
    aspect-ratio: 16 / 9;
    border-radius: 10px;
    background: var(--thumb-bg);
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modal-thumb::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(45deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 14px);
  }

  .modal-thumb-glyph {
    width: 64px;
    height: 64px;
    border: 2px solid rgba(255,255,255,0.35);
    border-radius: 6px;
    transform: rotate(45deg);
    position: relative;
  }

  .modal-thumb-glyph::after {
    content: '';
    position: absolute;
    inset: 14px;
    border: 2px solid rgba(255,255,255,0.35);
  }

  .modal-number {
    margin-top: 24px;
    font-family: 'Press Start 2P', cursive;
    font-size: 11px;
    color: var(--primary);
    letter-spacing: 1px;
  }

  .modal-title {
    margin-top: 12px;
    font-family: 'Press Start 2P', cursive;
    font-size: 20px;
    letter-spacing: 2px;
    line-height: 1.5;
  }

  .modal-summary {
    margin-top: 14px;
    font-size: 16px;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    line-height: 1.6;
  }

  .modal-note {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border-dim, rgba(193,63,224,0.22));
    font-size: 13px;
    letter-spacing: 0.5px;
    color: rgba(185, 180, 204, 0.7);
  }

  .glitching { animation: glitch 0.42s linear; }

  @media (max-width: 560px) {
    .modal { padding: 28px 22px; }
    .modal-title { font-size: 16px; }
  }
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="intro">
  <canvas id="bg-canvas"></canvas>
  <div class="vignette"></div>
  <div class="scanlines"></div>

  <div class="overlay">
    <div class="eyebrow">// COMMUNITY PROJECT ARCHIVE</div>
    <h1 class="title">PROJECT <span>HUB</span></h1>
    <p class="tagline">개인과 팀의 프로젝트를 카드로 모아 소개하는 공간입니다.<br />커서를 움직여 격자를 깨워보세요.</p>
    <button id="enterBtn" class="enter-btn">ENTER</button>
  </div>

  <div class="hint">MOVE CURSOR TO INTERACT</div>
</div>

<div id="gallery">
  <div class="gallery-backdrop"></div>
  <div class="gallery-page">
    <header>
      <h1 class="brand">PROJECT <span>HUB</span></h1>
      <p>총 8개의 프로젝트가 준비 중입니다 — 카드를 클릭해 상세 정보를 확인하세요.</p>
    </header>
    <main>
      <div class="gallery">
        <ul class="cards" id="cardsList"></ul>
        <div class="actions">
          <button class="prev" id="prevBtn" aria-label="이전 프로젝트">‹ PREV</button>
          <button class="next" id="nextBtn" aria-label="다음 프로젝트">NEXT ›</button>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="drag-proxy" id="dragProxy"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <button class="modal-close" id="modalClose" aria-label="닫기">✕</button>
    <div class="modal-thumb" id="modalThumb"><div class="modal-thumb-glyph"></div></div>
    <div class="modal-number" id="modalNumber">01</div>
    <h2 class="modal-title" id="modalTitle">PROJECT 01</h2>
    <p class="modal-summary" id="modalSummary">Coming Soon</p>
    <p class="modal-note">이 프로젝트는 아직 준비 중입니다. 완성되는 대로 상세 정보와 링크가 이곳에 표시됩니다.</p>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import gsap from 'https://cdn.jsdelivr.net/npm/gsap@3.15.0/index.js';
import Draggable from 'https://cdn.jsdelivr.net/npm/gsap@3.15.0/Draggable.js';
import InertiaPlugin from 'https://cdn.jsdelivr.net/npm/gsap@3.15.0/InertiaPlugin.js';

gsap.registerPlugin(Draggable, InertiaPlugin);

/* ---------------------------------------------------------------
   PROJECT HUB — intro background
   Layer 1: grid of instanced tiles, height-displaced by cursor + time wave
   Layer 2: purple/blue gradient color + real shadow on raised tiles
   Layer 3: chromatic aberration post-process pass
--------------------------------------------------------------- */

const canvas = document.getElementById('bg-canvas');

const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0D0B1A);
scene.fog = new THREE.FogExp2(0x0D0B1A, 0.045);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 200);
camera.position.set(0, 13.5, 16);
camera.lookAt(0, 0, -2);

/* ---------------- lights ---------------- */
const ambient = new THREE.AmbientLight(0x2a2050, 0.65);
scene.add(ambient);

const keyLight = new THREE.DirectionalLight(0xffffff, 1.15);
keyLight.position.set(9, 18, 10);
keyLight.castShadow = true;
keyLight.shadow.mapSize.set(1024, 1024);
keyLight.shadow.camera.left = -32;
keyLight.shadow.camera.right = 32;
keyLight.shadow.camera.top = 32;
keyLight.shadow.camera.bottom = -32;
keyLight.shadow.camera.near = 1;
keyLight.shadow.camera.far = 60;
keyLight.shadow.bias = -0.0015;
scene.add(keyLight);

const rimLight = new THREE.PointLight(0xC13FE0, 0.7, 40);
rimLight.position.set(-6, 6, -6);
scene.add(rimLight);

/* ---------------- ground (shadow catcher) ---------------- */
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({ color: 0x0f0c22, roughness: 1, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.02;
ground.receiveShadow = true;
scene.add(ground);

/* ---------------- instanced tile grid ---------------- */
const COLS = 60;
const ROWS = 34;
const SPACING = 1.0;
const TILE_SIZE = 0.86;
const BASE_DEPTH = 0.08;
const COUNT = COLS * ROWS;

const geometry = new THREE.BoxGeometry(1, 1, 1);
const material = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  roughness: 0.45,
  metalness: 0.12,
});

const grid = new THREE.InstancedMesh(geometry, material, COUNT);
grid.castShadow = true;
grid.receiveShadow = true;
grid.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(grid);

const cellX = new Float32Array(COUNT);
const cellZ = new Float32Array(COUNT);
const energy = new Float32Array(COUNT);

{
  let i = 0;
  const offX = ((COLS - 1) * SPACING) / 2;
  const offZ = ((ROWS - 1) * SPACING) / 2;
  const dummy = new THREE.Object3D();
  const white = new THREE.Color(0xffffff);
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const x = c * SPACING - offX;
      const z = r * SPACING - offZ;
      cellX[i] = x;
      cellZ[i] = z;
      dummy.position.set(x, BASE_DEPTH / 2, z);
      dummy.scale.set(TILE_SIZE, BASE_DEPTH, TILE_SIZE);
      dummy.updateMatrix();
      grid.setMatrixAt(i, dummy.matrix);
      grid.setColorAt(i, white);
      i++;
    }
  }
  grid.instanceMatrix.needsUpdate = true;
  grid.instanceColor.needsUpdate = true;
}

/* ---------------- pointer -> world plane ---------------- */
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2(0, 0);
const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
const mouseWorld = new THREE.Vector3(9999, 0, 9999);
let hasPointer = false;

function updatePointer(clientX, clientY) {
  pointerNDC.x = (clientX / window.innerWidth) * 2 - 1;
  pointerNDC.y = -(clientY / window.innerHeight) * 2 + 1;
  hasPointer = true;
}

window.addEventListener('pointermove', (e) => updatePointer(e.clientX, e.clientY), { passive: true });
window.addEventListener('pointerdown', (e) => updatePointer(e.clientX, e.clientY), { passive: true });
window.addEventListener('touchmove', (e) => {
  if (e.touches.length) updatePointer(e.touches[0].clientX, e.touches[0].clientY);
}, { passive: true });
document.addEventListener('mouseleave', () => { mouseWorld.set(9999, 0, 9999); });

/* ---------------- chromatic aberration pass ---------------- */
const ChromaticAberrationShader = {
  uniforms: {
    tDiffuse: { value: null },
    amount: { value: 0.0045 },
  },
  vertexShader: /* glsl */`
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
    }
  `,
  fragmentShader: /* glsl */`
    uniform sampler2D tDiffuse;
    uniform float amount;
    varying vec2 vUv;
    void main() {
      vec2 dir = vUv - 0.5;
      vec2 offset = dir * amount;
      float r = texture2D(tDiffuse, vUv - offset).r;
      float g = texture2D(tDiffuse, vUv).g;
      float b = texture2D(tDiffuse, vUv + offset).b;
      float a = texture2D(tDiffuse, vUv).a;
      gl_FragColor = vec4(r, g, b, a);
    }
  `,
};

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const caPass = new ShaderPass(ChromaticAberrationShader);
caPass.renderToScreen = true;
composer.addPass(caPass);

/* ---------------- resize ---------------- */
function onResize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
  composer.setSize(w, h);
}
window.addEventListener('resize', onResize);

/* ---------------- animation loop ---------------- */
const clock = new THREE.Clock();
const dummy = new THREE.Object3D();
const white = new THREE.Color(0xffffff);
const purple = new THREE.Color(0x8b2fe0);
const blue = new THREE.Color(0x3fa9f5);
const tmpMix = new THREE.Color();
const tmpFinal = new THREE.Color();

const RADIUS = 5.2;
const MAX_HEIGHT = 2.4;
const DECAY_RATE = 2.1;

function tick() {
  const delta = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // project pointer onto the grid plane
  if (hasPointer) {
    raycaster.setFromCamera(pointerNDC, camera);
    if (raycaster.ray.intersectPlane(groundPlane, mouseWorld) === null) {
      // ray parallel / missed — keep last known position
    }
  }

  // gentle expanding ring on load, so the grid feels alive on first paint
  const introActive = t < 2.4;
  const ringRadius = t * 15;

  const decayFactor = Math.exp(-delta * DECAY_RATE);

  for (let i = 0; i < COUNT; i++) {
    const x = cellX[i];
    const z = cellZ[i];

    const dx = x - mouseWorld.x;
    const dz = z - mouseWorld.z;
    const dist = Math.sqrt(dx * dx + dz * dz);
    const pointerImpulse = Math.exp(-(dist * dist) / (2 * RADIUS * RADIUS));

    let impulse = pointerImpulse;
    if (introActive) {
      const ringDist = Math.abs(dist - ringRadius);
      const ringImpulse = Math.exp(-(ringDist * ringDist) / (2 * 2.6 * 2.6)) * 0.85;
      impulse = Math.max(impulse, ringImpulse);
    }

    energy[i] = Math.max(energy[i] * decayFactor, impulse);
    const e = energy[i];

    if (e < 0.0015) {
      // settle fully flat, skip trig work
      dummy.position.set(x, BASE_DEPTH / 2, z);
      dummy.scale.set(TILE_SIZE, BASE_DEPTH, TILE_SIZE);
      dummy.updateMatrix();
      grid.setMatrixAt(i, dummy.matrix);
      if (energy[i] !== 0 || i === 0) grid.setColorAt(i, white);
      continue;
    }

    const wave = Math.sin(t * 2.6 - dist * 1.15) * 0.5 + 0.5;
    const h = BASE_DEPTH + e * MAX_HEIGHT * (0.72 + 0.28 * wave);

    dummy.position.set(x, h / 2, z);
    dummy.scale.set(TILE_SIZE, h, TILE_SIZE);
    dummy.updateMatrix();
    grid.setMatrixAt(i, dummy.matrix);

    tmpMix.copy(purple).lerp(blue, wave);
    tmpFinal.copy(white).lerp(tmpMix, Math.min(e * 1.35, 1));
    grid.setColorAt(i, tmpFinal);
  }

  grid.instanceMatrix.needsUpdate = true;
  grid.instanceColor.needsUpdate = true;

  rimLight.position.x = Math.sin(t * 0.15) * 8;
  rimLight.position.z = Math.cos(t * 0.15) * 8;

  caPass.uniforms.amount.value = 0.0045 + Math.sin(t * 0.4) * 0.0018;

  composer.render();
  rafId = requestAnimationFrame(tick);
}
let rafId = requestAnimationFrame(tick);

/* ---------------- draggable coverflow gallery (drag-proxy technique) ---------------- */
const TOTAL = 8;
const hues = [275, 255, 290, 235, 300, 265, 285, 245]; // subtle purple/blue variety per thumb

const cardsList = document.getElementById('cardsList');
const projects = Array.from({ length: TOTAL }, (_, i) => {
  const n = String(i + 1).padStart(2, '0');
  return { id: n, title: `PROJECT ${n}`, summary: 'Coming Soon', hue: hues[i] };
});

projects.forEach((p) => {
  const li = document.createElement('li');
  li.style.setProperty('--thumb-bg', `linear-gradient(135deg, hsl(${p.hue} 55% 14%), hsl(${p.hue} 60% 7%))`);
  li.innerHTML = `
    <div class="card-face">
      <span class="card-number">${p.id}</span>
      <div class="card-glyph"></div>
      <div class="card-info">
        <div class="card-title">${p.title}</div>
        <div class="card-summary">${p.summary}</div>
        <div class="badge"><span class="badge-dot"></span>COMING SOON</div>
      </div>
    </div>
  `;
  cardsList.appendChild(li);
});

const cardEls = Array.from(cardsList.children);
const N = cardEls.length;
const dragProxy = document.getElementById('dragProxy');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

let STEP = 0;
let wrapPos = (v) => v;
let dragged = false;

/* gentle auto-drift: cards ease sideways on their own until the user drags,
   uses the prev/next buttons, or opens a card's modal */
const AUTO_PLAY_SPEED = 20; // px/sec, negative direction = same as "next"
let autoPlayEnabled = false;
let resumeTimer = null;

function pauseAutoPlay() {
  autoPlayEnabled = false;
  if (resumeTimer) {
    clearTimeout(resumeTimer);
    resumeTimer = null;
  }
}

function resumeAutoPlay(delay = 0) {
  if (resumeTimer) clearTimeout(resumeTimer);
  resumeTimer = setTimeout(() => {
    autoPlayEnabled = true;
    resumeTimer = null;
  }, delay);
}

function measure() {
  const w = cardEls[0].getBoundingClientRect().width;
  STEP = w * 0.82;
  const half = (STEP * N) / 2;
  wrapPos = gsap.utils.wrap(-half, half);
}

function updateGallery() {
  const proxyX = gsap.getProperty(dragProxy, 'x') || 0;
  cardEls.forEach((card, i) => {
    const x = wrapPos(i * STEP + proxyX);
    const p = gsap.utils.clamp(-1, 1, x / (STEP * 2.2));
    const absP = Math.abs(p);
    const depthShadow = `0 ${20 + absP * 10}px ${40 + absP * 20}px rgba(0,0,0,${0.35 + absP * 0.15})`;
    // gsap.set writes boxShadow inline, which would otherwise mask the
    // .selected CSS glow (inline style always wins over a stylesheet rule)
    const selectedGlow = card.classList.contains('selected')
      ? ', 0 0 0 2px rgba(193,63,224,0.85), 0 0 26px rgba(193,63,224,0.55)'
      : '';
    gsap.set(card, {
      x,
      rotateY: p * -32,
      scale: 1 - absP * 0.28,
      opacity: 1 - absP * 0.55,
      zIndex: Math.round((1 - absP) * 100),
      boxShadow: depthShadow + selectedGlow,
    });
  });
}

measure();
updateGallery();

Draggable.create(dragProxy, {
  type: 'x',
  trigger: '#cardsList',
  inertia: true,
  onPress() { dragged = false; pauseAutoPlay(); },
  onDrag() { dragged = true; updateGallery(); },
  onThrowUpdate: updateGallery,
  onRelease() { resumeAutoPlay(1400); },
  snap: { x: (value) => Math.round(value / STEP) * STEP },
});

gsap.ticker.add((time, deltaMs) => {
  if (!autoPlayEnabled) return;
  gsap.set(dragProxy, { x: `+=${-AUTO_PLAY_SPEED * (deltaMs / 1000)}` });
  updateGallery();
});

function step(dir) {
  pauseAutoPlay();
  gsap.to(dragProxy, {
    x: `+=${dir * STEP}`,
    duration: 0.7,
    ease: 'power3.out',
    onUpdate: updateGallery,
    onComplete: () => resumeAutoPlay(1200),
  });
}
prevBtn.addEventListener('click', () => step(1));
nextBtn.addEventListener('click', () => step(-1));

cardEls.forEach((li, i) => {
  li.addEventListener('click', () => {
    if (dragged) return;
    cardEls.forEach((el) => el.classList.remove('selected'));
    li.classList.add('selected');
    updateGallery();
    openModal(projects[i]);
  });
});

let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    measure();
    updateGallery();
  }, 150);
});

/* ---------------- modal ---------------- */
const modalOverlay = document.getElementById('modalOverlay');
const modalThumb = document.getElementById('modalThumb');
const modalNumber = document.getElementById('modalNumber');
const modalTitle = document.getElementById('modalTitle');
const modalSummary = document.getElementById('modalSummary');
const modalClose = document.getElementById('modalClose');
let lastFocused = null;

function openModal(p) {
  pauseAutoPlay();

  modalThumb.style.setProperty('--thumb-bg', `linear-gradient(135deg, hsl(${p.hue} 55% 14%), hsl(${p.hue} 60% 7%))`);
  modalNumber.textContent = p.id;
  modalTitle.textContent = p.title;
  modalSummary.textContent = p.summary;

  modalOverlay.classList.add('open');
  lastFocused = document.activeElement;
  modalClose.focus();

  [modalNumber, modalTitle].forEach((el) => {
    el.classList.remove('glitching');
    void el.offsetWidth;
    el.classList.add('glitching');
  });
}

function closeModal() {
  modalOverlay.classList.remove('open');
  if (lastFocused) lastFocused.focus();
  resumeAutoPlay(400);
}

modalClose.addEventListener('click', closeModal);
modalOverlay.addEventListener('click', (e) => {
  if (e.target === modalOverlay) closeModal();
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && modalOverlay.classList.contains('open')) closeModal();
});

/* ---------------- ENTER interaction: GSAP intro -> gallery transition ---------------- */
const enterBtn = document.getElementById('enterBtn');
const introEl = document.getElementById('intro');
const galleryEl = document.getElementById('gallery');
let entering = false;

// prime GSAP's own transform tracking for #gallery up front, so the later
// tween replaces this value instead of stacking a second transform on top
// of a CSS-authored one (see note on the #gallery rule).
gsap.set(galleryEl, { yPercent: 100 });

enterBtn.addEventListener('click', () => {
  if (entering) return;
  entering = true;
  enterBtn.classList.add('glitching');
  enterBtn.style.pointerEvents = 'none';
  galleryEl.style.pointerEvents = 'auto';

  gsap.timeline({
    onComplete: () => {
      introEl.style.visibility = 'hidden';
      cancelAnimationFrame(rafId);
      resumeAutoPlay(300);
    },
  })
    .to(introEl, { opacity: 0, y: -40, duration: 0.55, ease: 'power2.inOut' }, 0)
    .to(
      galleryEl,
      { yPercent: 0, opacity: 1, duration: 0.8, ease: 'expo.out' },
      0.05
    );
});
</script>
</body>
</html>
